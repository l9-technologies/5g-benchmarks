name: Verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm run check:agent-instructions
      - run: npm run check:publication
      - name: Scan public files for secrets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          python3 - <<'PYSCAN'
          import hashlib, os, pathlib, tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          archive=root/'gitleaks.tar.gz'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          with tarfile.open(archive) as bundle:
              (root/'gitleaks').write_bytes(bundle.extractfile('gitleaks').read())
          (root/'gitleaks').chmod(0o700)
          PYSCAN
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner
      - run: python3 -m unittest discover -s . -p 'test_*.py'
