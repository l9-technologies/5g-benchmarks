name: Verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'mini-linux' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm run check:agent-instructions
      - run: npm run check:publication
      - name: Scan public files for secrets
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            ARM64) scan_arch=arm64; export GITLEAKS_SHA=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080 ;;
            X64) scan_arch=x64; export GITLEAKS_SHA=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
            *) exit 1 ;;
          esac
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_${scan_arch}.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          python3 - <<'PYSCAN'
          import hashlib, os, pathlib, tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          archive=root/'gitleaks.tar.gz'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==os.environ['GITLEAKS_SHA']
          with tarfile.open(archive) as bundle:
              (root/'gitleaks').write_bytes(bundle.extractfile('gitleaks').read())
          (root/'gitleaks').chmod(0o700)
          PYSCAN
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
